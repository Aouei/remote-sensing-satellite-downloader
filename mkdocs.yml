site_name: Remote Sensing Satellite Downloader
site_description: Python library for downloading satellite images from multiple providers
site_author: Aouei
repo_url: https://github.com/Aouei/remote-sensing-satellite-downloader
repo_name: GitHub

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: en
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_category_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: numpy
            docstring_section_style: table
            members_order: source
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            filters:
              - "!^_"
              - "^__init__$"

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/overview.md
      - Design Patterns: architecture/design-patterns.md
      - Diagrams: architecture/diagrams.md
  - API Reference:
      - Base Module: api/base.md
      - OData API: api/odata.md
      - USGS API: api/usgs.md
      - Data Types:
          - Search Types: data-types/search.md
          - Enumerations: data-types/enums.md
      - Factories:
          - Search Factory: factories/search.md
      - Services:
          - Downloader: services/downloader.md
  - Guides:
      - Quick Start: guides/quickstart.md